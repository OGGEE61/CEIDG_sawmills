<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEIDG (16.10.Z) - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar / Filters -->
        <aside class="sidebar">
            <div class="logo">
                <h2>Firmy<span class="highlight">16.10.Z</span></h2>
                <p>Dane CEIDG</p>
            </div>
            
            <div class="filters">
                <h3>Filtry</h3>
                
                <div class="filter-group">
                    <label for="wojewodztwoFilter">Województwo</label>
                    <select id="wojewodztwoFilter">
                        <option value="">Wszystkie</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="statusFilter">Status</label>
                    <select id="statusFilter">
                        <option value="">Wszystkie</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="miastoFilter">Miasto</label>
                    <input type="text" id="miastoFilter" placeholder="Wpisz miasto...">
                </div>

                <div class="filter-group">
                    <label for="kodFilter">Kod pocztowy</label>
                    <input type="text" id="kodFilter" placeholder="np. 00-001">
                </div>

                <div class="filter-group">
                    <label for="searchFilter">Szukaj (Nazwa / NIP)</label>
                    <input type="text" id="searchFilter" placeholder="Wpisz nazwę lub NIP...">
                </div>

                <button id="resetFilters" class="btn btn-secondary">Resetuj Filtry</button>
            </div>
            
            <div class="status-indicator">
                <span class="dot pulse"></span> <span id="recordCount">Ładowanie danych...</span>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header Cards -->
            <div class="cards-grid">
                <div class="card stat-card">
                    <div class="stat-title">Liczba firm</div>
                    <div class="stat-value" id="totalFirms">0</div>
                </div>
                <div class="card stat-card">
                    <div class="stat-title">Najwięcej tartaków</div>
                    <div class="stat-value" id="topRegion">-</div>
                </div>
            </div>

            <!-- Charts -->
            <div class="charts-grid">
                <div class="card chart-card">
                    <h3>Firmy wg Województw</h3>
                    <div class="chart-container">
                        <canvas id="regionChart"></canvas>
                    </div>
                </div>
                <div class="card chart-card">
                    <h3>Nowe firmy wg lat (Top 5)</h3>
                    <div class="chart-container">
                        <canvas id="yearChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Data Table -->
            <div class="card table-card">
                <h3>Lista firm</h3>
                <div class="table-container">
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th>Nazwa</th>
                                <th>NIP</th>
                                <th>Regon</th>
                                <th>Województwo</th>
                                <th>Powiat</th>
                                <th>Gmina</th>
                                <th>Adres (Miasto, Ulica)</th>
                                <th>Kod Poczt.</th>
                                <th>Status</th>
                                <th>Data Rozp.</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Rows generated by JS -->
                        </tbody>
                    </table>
                </div>
                <div class="pagination">
                    <button id="prevPage" class="btn btn-icon" disabled>&larr;</button>
                    <span id="pageInfo">Strona 1 z 1</span>
                    <button id="nextPage" class="btn btn-icon" disabled>&rarr;</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
